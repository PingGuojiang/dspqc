<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Frame -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Tech Grid Background -->
  <path d="M64 128h384M64 256h384M64 384h384M128 64v384M256 64v384M384 64v384" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 8" opacity="0.4" />
  
  <!-- Dyson Sphere Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 12" />
  <ellipse cx="256" cy="256" rx="200" ry="90" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.6" transform="rotate(-25 256 256)" />
  
  <!-- Mixed Conveyor Belt Hex Core -->
  <polygon points="256,120 370,186 370,326 256,392 142,326 142,186" fill="#0b1329" stroke="#00f0ff" stroke-width="8" filter="url(#glow)" />
  
  <!-- Inner Segment Belts -->
  <path d="M170 210 L256 260 L342 210" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <path d="M170 260 L256 310 L342 260" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" />
  <path d="M256 260 L256 370" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="8 8" />

  <!-- Center Dyson Core Star -->
  <circle cx="256" cy="220" r="28" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="256" cy="220" r="16" fill="#ffffff" />
  
  <!-- Sorter Indicator Grippers -->
  <circle cx="160" cy="200" r="10" fill="#38bdf8" />
  <circle cx="352" cy="200" r="10" fill="#fbbf24" />
  <circle cx="256" cy="370" r="12" fill="#22c55e" />
</svg>
